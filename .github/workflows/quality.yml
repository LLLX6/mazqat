name: Quality

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Test, type-check, and lint
        run: npm run check
      - name: Build Sites server bundle
        run: npm run build
      - name: Build static preview
        run: npm run build:static
